<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>방문 통계 | 서울S치과 관리자</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f6f8; font-family: system-ui, "Malgun Gothic", sans-serif; overflow: hidden; }
  header { height: 50px; box-sizing: border-box; padding: 0 20px; background: #fff; border-bottom: 1px solid #e3e6ea; display: flex; align-items: center; gap: 12px; }
  header b { font-size: 15px; color: #1f2d3d; }
  header small { color: #6b7785; font-size: 12px; }
  .zoom { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #1f2d3d; }
  .zoom button { min-width: 34px; height: 30px; border: 1px solid #cfd5dc; background: #fff; border-radius: 6px; font-size: 15px; cursor: pointer; }
  .zoom button:hover { background: #eef2f6; }
  .zoom span { min-width: 44px; text-align: center; }
  .frame { height: calc(100% - 50px); overflow: auto; }
  iframe { border: 0; display: block; transform-origin: 0 0; }
  @media (max-width: 640px) { header small { display: none; } }
</style>
</head>
<body>
<header>
  <b>서울S치과 방문 통계</b>
  <small>권한이 있는 구글 계정으로 로그인해야 보입니다.</small>
  <div class="zoom">
    <button type="button" id="zout" aria-label="축소">−</button>
    <span id="zval">75%</span>
    <button type="button" id="zin" aria-label="확대">+</button>
    <button type="button" id="zreset" aria-label="기본 배율" title="75%로 되돌리기">⟳</button>
  </div>
</header>
<div class="frame" id="frame">
  <iframe id="rpt" src="https://datastudio.google.com/embed/reporting/d56ae981-9af7-40c2-9749-fa720f6532ea/page/nrhAG" allowfullscreen sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
</div>
<script>
(function () {
  var DEF = 75, MIN = 40, MAX = 120, STEP = 5, KEY = 'statsZoom';
  var frame = document.getElementById('frame'), rpt = document.getElementById('rpt'), val = document.getElementById('zval');
  var z = DEF;
  try { var s = parseInt(localStorage.getItem(KEY), 10); if (s >= MIN && s <= MAX) z = s; } catch (e) {}
  function apply() {
    var k = z / 100;
    rpt.style.transform = 'scale(' + k + ')';
    rpt.style.width = (100 / k) + '%';
    rpt.style.height = (frame.clientHeight / k) + 'px';
    val.textContent = z + '%';
    try { localStorage.setItem(KEY, String(z)); } catch (e) {}
  }
  function set(v) { z = Math.max(MIN, Math.min(MAX, v)); apply(); }
  document.getElementById('zin').onclick = function () { set(z + STEP); };
  document.getElementById('zout').onclick = function () { set(z - STEP); };
  document.getElementById('zreset').onclick = function () { set(DEF); };
  window.addEventListener('resize', apply);
  apply();
})();
</script>
</body>
</html>
