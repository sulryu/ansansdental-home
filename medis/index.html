<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>임상사례 관리 | 서울S치과</title><meta name="robots" content="noindex, nofollow"><link rel="icon" type="image/png" sizes="64x64" href="/img/favicon.png"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><link rel="stylesheet" href="/detail.css"><link rel="stylesheet" href="/cases.css"><script src="/cases-config.js" defer></script><script src="/cases-admin.mjs" type="module"></script></head>
<body><header><div class="wrap header-inner"><a class="logo" href="/"><img src="/img/logo.png" alt="서울S치과의원" width="436" height="96"></a><nav aria-label="관리 메뉴"><a href="/clinical-cases.html">임상사례 보기</a><a href="/">홈페이지</a></nav></div></header><main class="wrap admin-wrap">
<div id="loginPanel" class="login-panel"><h1 style="font-size:26px">임상사례 관리자</h1><form id="loginForm"><div class="field"><label for="username">아이디</label><input id="username" name="username" value="seouls" autocomplete="username" required></div><div class="field"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">로그인</button></form><p id="loginStatus" class="status" role="status"></p></div>
<div id="editorPanel" hidden><div class="admin-toolbar"><h1 style="font-size:28px;margin:0">임상사례 관리</h1><div class="buttons" style="margin:0"><button class="btn" id="newCase" type="button">새 사례 작성</button><button class="btn secondary" id="logout" type="button">로그아웃</button></div></div><p id="adminStatus" class="status" role="status"></p>
<form id="caseForm" hidden><div class="field"><label for="title">제목</label><input id="title" name="title" minlength="2" maxlength="120" required></div><div class="form-grid"><div class="field"><label for="category">진료 분야</label><select id="category" name="category" required><option value="">선택해 주세요</option><option>임플란트</option><option>보철</option><option>충치·신경치료</option><option>잇몸치료</option><option>턱관절</option><option>기타</option></select></div><div class="field"><label for="doctor">담당 원장</label><select id="doctor" name="doctor" required><option value="">선택해 주세요</option><option value="이승준">이승준 원장</option><option value="김유범">김유범 원장</option></select></div><div class="field"><label for="treatment_date">진료일</label><input id="treatment_date" name="treatment_date" type="date" required></div></div>
<div class="field"><label for="summary">목록에 표시할 요약</label><textarea id="summary" name="summary" rows="2" minlength="2" maxlength="500" required></textarea></div><div class="field"><label for="body">치료 과정</label><textarea id="body" name="body" rows="10" minlength="2" maxlength="12000" required></textarea></div>
<div class="form-grid"><div class="field"><label for="before">치료 전 사진</label><input id="before" name="before" type="file" accept="image/jpeg,image/png,image/webp"><p id="beforeExisting" class="note"></p></div><div class="field"><label for="after">치료 후 사진</label><input id="after" name="after" type="file" accept="image/jpeg,image/png,image/webp"><p id="afterExisting" class="note"></p></div></div><p class="note">JPG·PNG·WebP, 사진당 8MB 이하. 환자를 식별할 수 있는 정보는 제거한 사진을 사용해 주세요.</p>
<label class="check"><input name="consent_confirmed" type="checkbox">사진과 내용의 게시 동의를 확인했습니다.</label><label class="check"><input name="published" type="checkbox">홈페이지에 공개하기</label><p class="note">공개하기를 체크하지 않으면 관리자에게만 보이는 임시 저장으로 남습니다.</p><div class="buttons"><button class="btn" type="submit">저장하기</button><button class="btn secondary" id="cancelEdit" type="button">작성 닫기</button><button class="btn danger" id="deleteCase" type="button" hidden>삭제하기</button></div><p id="saveStatus" class="status" role="status"></p></form>
<ul class="admin-list" id="adminList"></ul><button class="btn secondary" id="adminMore" type="button" hidden>더 보기</button></div></main></body></html>
