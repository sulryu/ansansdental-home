<body><header class="site-header"><div class="site-header-inner"><a class="site-logo" href="/"><img src="/img/logo.png" alt="서울S치과의원" width="436" height="96"></a><nav class="site-nav" aria-label="주요 메뉴"><a href="/#treatments">진료과목</a><a href="/#doctors">의료진</a><a href="/clinical-cases.html">임상사례</a><a href="/#faq">FAQ</a><a href="/#visit">오시는 길</a></nav><div class="site-actions"><a class="site-reserve" href="https://naver.me/xcn0EKwS" target="_blank" rel="noopener">네이버 예약</a><a class="site-talk" href="https://talk.naver.com/profile/wmjntbv" target="_blank" rel="noopener">톡톡 상담</a><button type="button" class="site-menu-button" data-site-menu aria-haspopup="dialog" aria-controls="siteMenu" aria-label="전체 메뉴 열기"><span aria-hidden="true">☰</span></button></div></div></header><main class="wrap admin-wrap">
<div id="loginPanel" class="login-panel"><h1 style="font-size:26px">임상사례 관리자</h1><form id="loginForm"><div class="field"><label for="username">아이디</label><input id="username" name="username" value="seouls" autocomplete="username" required></div><div class="field"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">로그인</button></form><p id="loginStatus" class="status" role="status"></p></div>
<div id="editorPanel" hidden><div class="admin-toolbar"><h1 style="font-size:28px;margin:0">임상사례 관리</h1><div class="buttons" style="margin:0"><button class="btn" id="newCase" type="button">새 사례 작성</button><button class="btn secondary" id="logout" type="button">로그아웃</button></div></div><p id="adminStatus" class="status" role="status"></p>
<form id="caseForm" hidden><div class="field"><label for="title">제목</label><input id="title" name="title" minlength="2" maxlength="120" required></div><div class="form-grid"><div class="field"><label for="category">진료 분야</label><select id="category" name="category" required><option value="">선택해 주세요</option><option>임플란트</option><option>보철</option><option>충치·신경치료</option><option>잇몸치료</option><option>턱관절</option><option>기타</option></select></div><div class="field"><label for="doctor">담당 원장</label><select id="doctor" name="doctor" required><option value="">선택해 주세요</option><option value="이승준">이승준 원장</option><option value="김유범">김유범 원장</option></select></div><div class="field"><label for="treatment_date">진료일 (선택)</label><input id="treatment_date" name="treatment_date" type="date"></div></div>
<div class="field"><label for="summary">목록에 표시할 요약</label><textarea id="summary" name="summary" rows="2" minlength="2" maxlength="500" required></textarea></div><div class="field"><label id="bodyLabel">치료 과정</label>
<div class="body-options" aria-label="글꼴과 글자 크기"><label>글꼴 <select id="bodyFont" aria-label="글꼴"><option value="">기본 글꼴</option><option value="pretendard">프리텐다드</option><option value="malgun">맑은 고딕</option><option value="serif">명조체</option></select></label><label>크기 <select id="bodySize" aria-label="글자 크기"><option value="">기본 16px</option><option>14px</option><option>16px</option><option>18px</option><option>20px</option><option>24px</option><option>28px</option><option>32px</option></select></label><label>색 <select id="bodyColor" aria-label="글자색"><option value="">기본색</option><option value="#2a3a86">남색</option><option value="#a22532">빨강</option><option value="#17623e">초록</option><option value="#5b6475">회색</option></select></label></div><div id="bodyToolbar" class="body-toolbar" role="toolbar" aria-label="본문 서식">


<span class="ql-formats" data-group="문자"><button type="button" class="ql-header" value="2" aria-label="소제목" title="소제목"></button><button type="button" class="ql-bold" aria-label="굵게" title="굵게"></button><button type="button" class="ql-italic" aria-label="기울임" title="기울임"></button><button type="button" class="ql-underline" aria-label="밑줄" title="밑줄"></button><button type="button" class="ql-strike" aria-label="취소선" title="취소선"></button></span>

<button type="button" class="history-button" id="bodyUndo" title="실행 취소">실행 취소</button><button type="button" class="history-button" id="bodyRedo" title="다시 실행">다시 실행</button></div>
<div id="bodyEditor" aria-labelledby="bodyLabel"></div><textarea id="body" name="body" hidden></textarea><p id="bodyHelp" class="note">글을 선택한 뒤 서식을 적용하세요. Ctrl+Z로 실행 취소할 수 있습니다.</p><p id="bodyCount" class="note"></p></div>
<div class="form-grid"><div class="field"><label for="before">치료 전 사진</label><input id="before" name="before" type="file" accept="image/jpeg,image/png,image/webp"><p id="beforeExisting" class="note"></p><img id="beforePreview" class="photo-preview" alt="치료 전 사진 미리보기" hidden></div><div class="field"><label for="after">치료 후 사진</label><input id="after" name="after" type="file" accept="image/jpeg,image/png,image/webp"><p id="afterExisting" class="note"></p><img id="afterPreview" class="photo-preview" alt="치료 후 사진 미리보기" hidden></div></div><p class="note">JPG·PNG·WebP, 사진당 8MB 이하. 환자를 식별할 수 있는 정보는 제거한 사진을 사용해 주세요.</p>
<label class="check"><input name="consent_confirmed" type="checkbox">사진과 내용의 게시 동의를 확인했습니다.</label><label class="check"><input name="published" type="checkbox">홈페이지에 공개하기</label><p class="note">공개하기를 체크하지 않으면 관리자에게만 보이는 임시 저장으로 남습니다.</p><div class="admin-save-bar"><div class="buttons"><button class="btn" type="submit">저장하기</button><button class="btn secondary" id="previewCase" type="button">미리보기</button><button class="btn secondary" id="cancelEdit" type="button">작성 닫기</button><button class="btn danger" id="deleteCase" type="button" hidden>삭제하기</button></div><p id="saveStatus" class="status" role="status"></p></div></form>
